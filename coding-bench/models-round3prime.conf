# models-round3prime.conf — the qualifying round VibeThinker was promised.
#
# Same format as models.conf (alias|repo|file|notes|server_args). Read that file
# for the full field documentation and the preflight-probe notes.
#
# WHY THIS ROUND EXISTS
#
# round3-recommendation.md:415 ruled "one attempt, then drop" on VibeThinker:
#
#   Failed `tool_calls` for the third round running [...] **The old version's
#   prescribed fix was never tried**: `models.conf` still carries no
#   `--chat-template-file` override for it. Give it the one ChatML-tools
#   template attempt, then drop.
#
# The attempt was never made. `git log -S` over models.conf shows the
# VibeThinker line was added once and its server_args column has been empty
# ever since, and it was dropped from round 4 without it. So its three failures
# to date say nothing about its coding: it has never been able to call a tool,
# and in round 1 its debounce reasoning was largely correct and never reached
# disk. This round settles that, and nothing else.
#
# NOT a repeat of round 3. The harness has moved on (measured decode at depth,
# --parallel 1, honest overhead factor, algo/pkg split grading, no injection
# component), and OVERHEAD_FACTOR changed 1.35 -> 1.9 after round 4. That last
# change alone means round 3' numbers are NOT comparable to round 4's for any
# model, which is why two incumbents run alongside VibeThinker rather than
# comparing it against round 4's table.
#
# WHY GRANITE IS THE ONE DROPPED
#
# Not on score. On the shipped pass rate no pair of the three separates
# (Fisher p >= 0.19), exactly as bench-findings-filter-141131.md §1 says, and
# scored on the algorithm alone all three were identical at 8/12.
#
# The reason is instruction-following. The system prompt states the ESM rules
# verbatim — "never require() or module.exports", "require, module, exports,
# __filename and __dirname DO NOT EXIST", and an exact main-detection snippet to
# use. Round 4 deliverables that break one of those rules:
#
#   Granite   8 of 12   (6 fatal)
#   Nanbeige  1 of 12   (0 fatal)
#   Spark     0 of 12   (0 fatal)
#
# Fisher: Granite vs Spark p=0.0013, vs Nanbeige p=0.0094, vs both pooled
# p=0.00013. That is two to three orders of magnitude stronger than anything in
# the pass-rate table, and it is the one place round 4 separates cleanly.
#
# It also survives the obvious objection. Those rules were added to the system
# prompt in round 2 FOR GRANITE — run-filter-bench.sh:648 records that Granite
# fixed all three seeded debounce bugs in round 1 and still scored below models
# that fixed two, "purely because `process.main === module` throws in ESM", and
# the exact snippet was spelled out in response. Two rounds later Granite still
# ships require.main, __filename and module.exports, and all four of its round-4
# scaffolding deaths are in that list. A targeted fix was applied and the model
# did not respond to it, so there is no further harness change to try.
#
# The honest counter-argument, recorded because it is real: Granite is the best
# of the three at the actual bug-finding task (3/4 on the seeded argument-spread
# bug against Spark 2/4 and Nanbeige 1/4), and its algorithm score ties. If the
# question were "which model reasons best about code" it would stay. The
# question this benchmark asks is which model to deploy on this laptop, and a
# model that ignores environment rules written verbatim in its own system prompt
# is a bad deployment regardless of how well it reasons.
#
# SIZING. 3 repeats, not 4 — this is a qualifying round, and "round 3'" is the
# repeat count round 3 used. Per-cell caps at OVERHEAD_FACTOR=1.9, from round
# 4's measured depth rates:
#
#   Nanbeige     7.42 tok/s -> 3073s     VibeThinker has no measured depth rate;
#   Spark       13.03       -> 1750s     round 1 gave 3711 tok in 194s on a short
#   VibeThinker ~14 (est)   -> ~1629s    run, so ~14 at depth is the planning
#                                        figure. The harness measures it for real.
#
# 3 tasks x 3 repeats = 9 cells each, ~16.1 h worst case. Round 4's actual/worst
# was 0.83, so expect ~13.5 h. SET BENCH_DEADLINE — at 1.9x the guard is the
# only thing bounding this.
#
# ORDER MATTERS. Models run in file order and the deadline guard trims from the
# end, so the model this round exists to settle goes first. Spark is last: it is
# the best characterised of the three (24 trials in round 4) and therefore the
# cheapest to lose if the guard has to cut.

# The whole point of the round. VibeThinker-3B is Qwen2ForCausalLM (3.09B)
# finetuned from Qwen2.5-Coder-3B; the override points it at the BASE MODEL'S
# OWN tool-calling template, which is the smallest change that can work. If the
# tool_calls probe still fails with this, the "one attempt" is spent — drop it.
# Watch for one wrinkle the smoke test exists to catch: this template has no
# <think> handling, so if reasoning leaks into visible content, try
# --reasoning-format deepseek alongside it before calling the attempt spent.
