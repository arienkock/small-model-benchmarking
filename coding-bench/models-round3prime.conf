# models-round3prime.conf — the qualifying round VibeThinker was promised.
#
# Same format as models.conf (alias|repo|file|notes|server_args). Read that file
# for the full field documentation and the preflight-probe notes.
#
# WHY THIS ROUND EXISTS
#
# round3-recommendation.md:415 ruled "one attempt, then drop" on VibeThinker:
#
#   Failed `tool_calls` for the third round running [...] **The old version's
#   prescribed fix was never tried**: `models.conf` still carries no
#   `--chat-template-file` override for it. Give it the one ChatML-tools
#   template attempt, then drop.
#
# The attempt was never made. `git log -S` over models.conf shows the
# VibeThinker line was added once and its server_args column has been empty
# ever since, and it was dropped from round 4 without it. So its three failures
# to date say nothing about its coding: it has never been able to call a tool,
# and in round 1 its debounce reasoning was largely correct and never reached
# disk. This round settles that, and nothing else.
#
# NOT a repeat of round 3. The harness has moved on (measured decode at depth,
# --parallel 1, honest overhead factor, algo/pkg split grading, no injection
# component), and OVERHEAD_FACTOR changed 1.35 -> 1.9 after round 4. That last
# change alone means round 3' numbers are NOT comparable to round 4's for any
# model, which is why two incumbents run alongside VibeThinker rather than
# comparing it against round 4's table.
#
# WHY NANBEIGE IS THE ONE DROPPED — AND WHY GRANITE IS NOT
#
# An earlier draft of this file dropped Granite on the strength of one number:
# round-4 deliverables breaking an ESM rule the system prompt states verbatim,
# Granite 8 of 12 (6 fatal) against Nanbeige 1 and Spark 0, Fisher p=0.0013.
# The number is right and the conclusion drawn from it was wrong, because it
# was read as a fact about the model when it is a fact about the harness.
#
# Look at what Granite actually does. Of its five packaging deaths:
#   3  it never executed the artifact at all (02-r1, 02-r4, 03-r4)
#   1  it executed it, saw red, diagnosed it correctly ("the throttle.ts file
#      needs fixing for ES module syntax") and ran out of budget mid-rewrite
#      (02-r2)
#   1  it executed it TWICE, its own run printed "all tests passed", and the
#      grader still failed it (01-r1)
#
# None is a case of looking at a red signal and ignoring it. Granite runs more
# verification commands than either peer (97 vs Nanbeige 72, Spark 48) and has
# the best red-to-green convergence in the round (32 red : 65 green, ending
# green in 11 of 12 cells). Its algorithm score ties at 8/12 and it is the best
# of the three at the seeded bug the benchmark was built around (3/4 on the
# argument spread, against Spark 2/4 and Nanbeige 1/4).
#
# The last case is the harness's fault outright. 01-r1 ships
# `if (import.meta.main || process.argv[1] === __filename)`. Run directly,
# import.meta.main short-circuits the || and it prints "all tests passed";
# imported, it evaluates __filename and throws. The model verified exactly as
# the prompt instructed — `node debounce.ts` — and the prescribed check is
# structurally blind to the defect the grader tests for. Reproduced directly.
#
# And the claim that a targeted fix had already failed does not survive either.
# What was applied in round 2 was a SENTENCE in the system prompt. The harness's
# own strong instrument was never pointed at this: bench-guard.ts blocks a
# forbidden action inline with the correction in hand, and across every round
# 13 of 13 blocks were followed by a different action — no model has ever
# retried a blocked one. The weakest available intervention was tried; the
# strongest was never tried. Dropping a model for failing an intervention that
# was never made is not a measurement.
#
# Both gaps are now closed (bench-guard.ts enforces the ESM rules at write time
# and counts every correction; the system prompt states that the module is
# imported as well as run), so round 3' measures Granite's coding rather than
# its memory of a rule. Replaying the new guard over round 4 catches 6 of
# Granite's 12 deliverables at write time, including 4 of its 5 packaging
# deaths. Granite is the model with the most uncertainty left in it and the
# cheapest cells in which to resolve it — exactly what a qualifying round is
# for.
#
# Nanbeige goes instead, on grounds that are not about coding ability:
#
#   1. COST. It took 21,330s of round 4's 44,355s — 48% of the round for one
#      of three models — and at OVERHEAD_FACTOR=1.9 it costs 3073s per cell
#      against Granite's 1427s. Dropping it frees ~4.1h at 3 repeats, which is
#      what pays for VibeThinker with room left over.
#   2. ITS RETENTION WAS CONDITIONAL AND THE CONDITION IS DISCHARGED.
#      round3-recommendation.md:418 kept it explicitly: "re-run before judging
#      — its 9/15 was scored on a third of its peers' token allowance because
#      of a probe bug. Do not cut it on round 3." Round 4 was that re-run, on a
#      measured budget. It came out indistinguishable from both peers (p=0.50
#      vs Spark, p=0.75 vs Granite). The debt is paid and nothing emerged.
#   3. NO BEST-IN-CLASS AXIS, unlike the other two. Granite: best at the seeded
#      bug, most verification activity, best convergence. Spark: zero packaging
#      deaths, zero rule violations, best shipped output, the only model that
#      named the injection as a trap. Nanbeige: worst on the seeded bug (1/4),
#      middle everywhere else, slowest by a factor of two, and the only model
#      needing a config workaround (q8_0 KV) to fit at all.
#   4. ITS FAILURES ARE THE ONES NO HARNESS CHANGE REACHES. Its worst round-4
#      cells were an unquoted `&` in a curl that became a phantom bug hunt and
#      shipped as a hardcoded debug path, and a working inline repro it never
#      diffed against the failing file. Those are reasoning and discipline, not
#      packaging. There is nothing to hand it that would change the result, so
#      another 9 cells at twice the price buys the least of the three.
#
# The honest counter-argument, recorded because it is real: Nanbeige is the
# only model whose deployable configuration this roster has actually tuned
# (q8_0 KV, measured headroom), and cutting it leaves that work unused. If the
# next round needs a third incumbent it is the one to bring back.
#
# SIZING. 3 repeats, not 4 — this is a qualifying round, and "round 3'" is the
# repeat count round 3 used. Per-cell caps at OVERHEAD_FACTOR=1.9, from round
# 4's measured depth rates:
#
#   Granite     15.98 tok/s -> 1427s    VibeThinker has no measured depth rate;
#   Spark       13.03        -> 1750s    round 1 gave 3711 tok in 194s on a short
#   VibeThinker ~14 (est)    -> ~1629s   run, so ~14 at depth is the planning
#                                        figure. The harness measures it for real.
#
# 3 tasks x 3 repeats = 9 cells each, ~12.0 h worst case. Round 4's actual/worst
# was 0.83, so expect ~10 h. SET BENCH_DEADLINE — at 1.9x the guard is the only
# thing bounding this.
#
# ORDER MATTERS. Models run in file order and the deadline guard trims from the
# end, so the model this round exists to settle goes first. Spark is last: it is
# the best characterised of the three (24 trials in round 4) and therefore the
# cheapest to lose if the guard has to cut.

# The whole point of the round. VibeThinker-3B is Qwen2ForCausalLM (3.09B)
# finetuned from Qwen2.5-Coder-3B; the override points it at the BASE MODEL'S
# OWN tool-calling template, which is the smallest change that can work. If the
# tool_calls probe still fails with this, the "one attempt" is spent — drop it.
# Watch for one wrinkle the smoke test exists to catch: this template has no
# <think> handling, so if reasoning leaks into visible content, try
# --reasoning-format deepseek alongside it before calling the attempt spent.
#
# That wrinkle is exactly what happened. Smoke bench-filter-20260914-195800 on
# 2026-09-14: turn_boundary=OK and finish_reason=stop -- the template itself
# works -- but tool_calls=FAIL, with the sample showing <think>-wrapped prose
# ("<think>The user is asking: \"Create a file named hello.txt ...") in visible
# content. So --reasoning-format deepseek is now on the line below, per the
# runbook's second branch. The one attempt is NOT yet spent: if tool_calls still
# fails with the reasoning stripped, that is the terminal branch -- drop the
# line and run the round with Granite and Spark.
#
# VERDICT, 2026-09-14: THE ATTEMPT IS SPENT. DROPPED.
#
# Smoke bench-filter-20260914-201626, with --reasoning-format deepseek added as
# the branch above prescribes: tool_calls=FAIL again. This is the terminal
# branch, and the evidence says the model, not the harness:
#
#   - The probe allows max_tokens=1024. VibeThinker stopped on its own after
#     193 generated tokens with finish_reason=stop. It was never cut off.
#   - Visible content still OPENS with "<think>" even with the deepseek parser
#     active, which means it never emits a closing </think> for the parser to
#     split on. It opens a reasoning block, narrates ABOUT calling write_file,
#     and ends the turn -- without closing the block and without a tool call.
#   - The template itself is fine: turn_boundary=OK, finish_reason=stop, in both
#     smokes. The Qwen2.5-tools override did its job; the model will not use it.
#
# Four rounds, and the prescribed fix plus its prescribed follow-up have now
# both been tried. Its line is removed below rather than commented back in.
# Restoring it needs a NEW reason, not another retry.
#
# Incumbent, and the model this round re-measures. Its round-4 shipped score was
# held down by ESM packaging the guard now blocks at write time and by a
# verification instruction that could not see the defect; both are fixed. If it
# still ships broken files with the guard correcting it inline, that is a real
# result and the question is settled the other way.
