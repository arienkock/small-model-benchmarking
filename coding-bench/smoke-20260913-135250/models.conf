# models-round4.conf — the three-model shortlist round.
#
# Same format as models.conf (alias|repo|file|notes|server_args). Read that file
# for the full field documentation and the preflight-probe notes.
#
# WHY ONLY THREE
#
# Round 3 (bench-filter-20260912-202533) graded five models over 3 tasks x 3
# repeats. Treating the 15 scored components as binary trials, Fisher exact on
# every pair says only LFM2.5 separates cleanly (p=0.003 against the leaders);
# MiniCPM5 is marginal (p=0.060); and Granite, Spark and Nanbeige are mutually
# indistinguishable (every pairwise p >= 0.427). So the live field is exactly
# these three, and the budget is better spent on repeats than on breadth:
#
#   round 3   5 models x 3 repeats = 45 cells, 18 trials/model
#   round 4   3 models x 4 repeats = 36 cells, 24 trials/model
#
# Round 4's scores are NOT comparable to round 3's for any model: the harness
# defaults changed (--parallel 1, honest overhead factor, working speed probe)
# and round 3's numbers were distorted for everyone. Round 3 is a pilot.
#
# PER-MODEL CONFIGURATION, NOT UNIFORM SETTINGS
#
# The question this benchmark answers is "which model should run on this
# laptop", and anyone deploying one would configure it properly. So the TEST is
# fixed for everyone (tasks, grader, context, sampling, time-budget rule) and the
# SETUP is per model, chosen by a fixed ladder: take the best quant that fits at
# 16384 with f16 KV; if it does not fit, drop KV to q8_0 and retry; only then
# step the quant down. The harness already does per-model setup in one place —
# each model gets its own chat template via --jinja — and quant/KV precision is
# the same kind of choice.
#
# Measured headroom at 16384 ctx on the 6143 MiB card (llama-bench -v, F1):
#
#   model         CUDA0 weights   KV/token   KV @16k    total    headroom
#   Granite       3449 MiB        80 KiB     1280 MiB   4729     1414 MiB
#   Spark         3217 MiB       108 KiB     1728 MiB   4945     1198 MiB
#   Nanbeige      3026 MiB       176 KiB     2816 MiB   5842      301 MiB  <-- wall
#
# Nanbeige is the only model that arrives at 16k with no room for compute
# buffers, because nanbeige.num_loops=2 gives it 44 effective layers over 22
# physical ones — so 2.2x Granite's KV for the same context. Confirmed live:
# llama-server at -c 16384 sat at 6000 MiB of 6143. Its prefill falls off a
# cliff between 12288 and 15360 (51.3 -> 12.4 tok/s where the trend says ~42),
# and 12.4 is exactly the ~15.7 tok/s the round-3 server logs recorded. That
# cliff, not the model, produced its 9/9 timeouts.
#
# NOT a quant problem: Q6_K and Q8_0 prefill identically (127.75 vs 127.45 at
# pp512). Quant does matter for DECODE on this Maxwell card, in the opposite
# direction to intuition — K-quant dequantisation costs more than the bandwidth
# it saves, measured on two same-model pairs:
#   MiniCPM5  Q8_0 2.49 GiB 28.53 tok/s  vs  Q4_K_M 1.45 GiB 27.02 tok/s
#   Nanbeige  Q8_0 4.13 GiB 11.38 tok/s  vs  Q6_K   3.34 GiB  9.37 tok/s
# So Q8_0 wins wherever it fits. It does not fit for Nanbeige at 16k (4.13 GiB
# weights + 2816 MiB KV = 6.6 GB), which is why Nanbeige keeps Q6_K and spends
# its headroom on KV instead.

# ORDER MATTERS. Models run in file order and the deadline guard trims from the
# end, so the most expensive and least-characterised model goes first. Nanbeige
# costs roughly 2x per cell and is the one this round exists to settle; Granite
# is the best characterised (3/3 on four of six components in round 3) and so is
# the cheapest thing to lose if the guard has to cut.

Nanbeige4.2-3B-Q6_K|bartowski/Nanbeige_Nanbeige4.2-3B-GGUF|Nanbeige_Nanbeige4.2-3B-Q6_K.gguf|q8_0 KV halves its 2816 MiB cache to ~1408 MiB, restoring ~1900 MiB of headroom and clearing the prefill cliff that caused round 3's 9/9 timeouts|-ctk q8_0 -ctv q8_0
Spark-X2.5-4B-Q6_K|sizzlebop/Spark-X2.5-4B-GGUF|Spark-X2.5-4B-Q6_K.gguf|1198 MiB headroom at 16k; Q8_0 would need ~4.1 GiB + 1728 MiB KV and not fit with f16 KV. Left at Q6_K for continuity with round 3; Q8_0 + q8_0 KV is the obvious next experiment|
