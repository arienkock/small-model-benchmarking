# ---------------------------------------------------------------------------
# DOWNLOAD SIZE
#
# The five new models total roughly 17 GB at these quants. llama-server fetches
# each one the first time it starts it, inside the context probe, so the first
# start per model can take a while — SERVER_START_TIMEOUT is 1800s to cover it.
# Downloading them ahead of the overnight run avoids eating the budget:
#
#     ../llama-server.exe -hf <repo> -hff <file> --no-warmup -c 512 &
#     # wait for it to finish fetching, then Ctrl-C
#
# ARCHITECTURE SUPPORT RISK
#
# Four of the five are recent architectures. If your llama.cpp build predates
# support for one, llama-server refuses to load it (usually "unknown model
# architecture"). The run script records that model in SKIPPED.txt and carries
# on, so one unsupported model cannot sink the night.
#
#   VibeThinker-3B  Qwen2ForCausalLM      — safe, long-supported
#   Granite 4.2     granitemoehybrid      — needs a recent build (hybrid Mamba)
#   Spark-X2.5      check on load
#   Nanbeige4.2     check on load
#   Apertus v1.1    ApertusForCausalLM    — needs a recent build (xIELU)
#
# Note that -hf/-hff needs a llama.cpp new enough to have the built-in
# downloader; if -hf is rejected, use repo=local entries with -m instead.
# ---------------------------------------------------------------------------
