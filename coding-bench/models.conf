# models.conf — the benchmark roster.
#
# Format (4 fields, '|' separated):
#
#   alias|hf_repo_id|gguf_filename|notes
#
#   alias     llama-server --alias AND the pi model id. Keep it filesystem-safe:
#             it becomes part of the workspace directory name.
#   repo      Hugging Face repo id, used for `hf download` if the GGUF is not
#             already in the local cache.
#   filename  exact filename inside the repo (a glob works, but exact names
#             cannot silently pick the wrong quant or size).
#   notes     free text, ignored by the script.
#
# Lines starting with # and blank lines are ignored.
#
# Verify the roster resolves without running anything:
#
#     ./run-filter-bench.sh --check-models
#
# All repo ids and filenames below were verified against the Hugging Face API
# on 2026-09-12.

# --- incumbents (carried over from run-coding-bench.sh, known good) ---
LFM2.5-2.6B-Q8_0|LiquidAI/LFM2.5-2.6B-GGUF|*Q8_0.gguf|baseline from run 143308
MiniCPM5-2B-Q8_0|openbmb/MiniCPM5-2B-GGUF|MiniCPM5-2B-Q8_0.gguf|baseline from run 143308

