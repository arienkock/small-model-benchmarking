# models.conf — the benchmark roster.
#
# NO HUGGING FACE TOOLING IS NEEDED ON THE BENCHMARK MACHINE. llama-server
# downloads models itself with -hf/-hff, into its own cache ($LLAMA_CACHE,
# default ~/.cache/llama.cpp). Preflight only does a curl against the HF API to
# confirm a repo/file exists before the run starts; nothing is installed.
#
# Format (4 fields, '|' separated):
#
#   alias|repo|file|notes
#
#   alias   llama-server --alias AND the pi model id. Keep it filesystem-safe:
#           it becomes part of the workspace directory name.
#   repo    Hugging Face repo id  ->  passed as -hf, downloaded on first use.
#           The literal word `local` instead  ->  field 3 is a path on this
#           machine, loaded with -m and never downloaded.
#   file    exact .gguf filename in the repo  ->  passed as -hff, so the quant
#           can never be guessed wrong. (With repo=local: the path to the file.)
#   notes   free text, ignored by the script.
#
# Lines starting with # and blank lines are ignored.
#
# Verify the roster without downloading or running anything:
#
#     ./run-filter-bench.sh --check-models
#
# Gated repos: export HF_TOKEN before the run; llama-server reads it.
#
# All repo ids and filenames verified against the Hugging Face API 2026-09-12.

