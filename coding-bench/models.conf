Apertus-4B-Instruct-v1.1-Q8_0|NonMiFrega/Apertus-v1.1-4B-Instruct-Q8_0-GGUF|apertus-v1.1-4b-instruct-q8_0.gguf|swiss-ai/Apertus-v1.1-4B-Instruct

# ---------------------------------------------------------------------------
# ARCHITECTURE SUPPORT RISK
#
# Four of the five new models are recent architectures. If your llama.cpp build
# predates support for one, llama-server will refuse to load it (usually
# "unknown model architecture"). The run script handles this: the model is
# recorded in SKIPPED.txt and the benchmark continues with the rest, so one
# unsupported model cannot sink the night.
#
#   VibeThinker-3B  Qwen2ForCausalLM      — safe, long-supported
#   Granite 4.2     granitemoehybrid      — needs a recent build (hybrid Mamba)
#   Spark-X2.5      check on load
#   Nanbeige4.2     check on load
#   Apertus v1.1    ApertusForCausalLM    — needs a recent build (xIELU)
#
# If several fail to load, update llama.cpp before the overnight run rather
# than burning the slot.
# ---------------------------------------------------------------------------
